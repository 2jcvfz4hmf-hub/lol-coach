<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' https://ddragon.leagueoflegends.com; style-src 'self'; script-src 'self'"
    />
    <title>LoL Coach</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>LoL Coach</h1>
      <span id="status"></span>
    </header>

    <main>
      <section id="waiting" class="card">
        <p id="waiting-text"></p>
      </section>

      <section id="draft" class="card" hidden>
        <h2>Sélection des champions</h2>
        <div class="teams">
          <div><h3>Ton équipe</h3><ul id="allies" class="slots"></ul></div>
          <div><h3>En face</h3><ul id="enemies" class="slots"></ul></div>
        </div>
        <h3>Picks conseillés</h3>
        <ol id="suggestions" class="suggestions"></ol>
        <h3>Contre leur compo</h3>
        <ul id="advice"></ul>
      </section>

      <section class="card">
        <div class="row">
          <h2 id="report-title">Analyse</h2>
          <button id="analyse-recent">Analyser mes 20 dernières ranked</button>
        </div>
        <p class="hint">Ta dernière partie est analysée automatiquement à la fin de chaque game.</p>
        <article id="report"></article>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
