# Met en ligne le relais Cloudflare qui permet de chercher un joueur sans lancer LoL.
# La clé Riot (secret RIOT_API_KEY) est copiée dans le relais, jamais dans l'appli.
name: Relais de recherche

on:
  push:
    branches: [main]
    paths: ["relais/**", ".github/workflows/relais.yml"]
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * *" # recopie la clé chaque jour, au cas où elle a changé

permissions:
  contents: write

concurrency:
  group: relais
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifie les secrets
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RIOT: ${{ secrets.RIOT_API_KEY }}
        run: |
          test -n "$CF" || { echo "::error::Secret CLOUDFLARE_API_TOKEN absent ou vide (Settings > Secrets and variables > Actions > Repository secrets)"; exit 1; }
          test -n "$RIOT" || { echo "::error::Secret RIOT_API_KEY absent ou vide"; exit 1; }

      - name: Prépare le stockage des builds de l'équipe
        working-directory: relais
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          id=$(npx -y wrangler@4 kv namespace list | jq -r '.[] | select(.title == "lol-coach-builds") | .id')
          if [ -z "$id" ]; then
            id=$(npx -y wrangler@4 kv namespace create lol-coach-builds | grep -oE '[0-9a-f]{32}' | head -1)
          fi
          test -n "$id" || { echo "::error::Impossible de créer le stockage des builds"; exit 1; }
          printf '\n[[kv_namespaces]]\nbinding = "BUILDS"\nid = "%s"\n' "$id" >> wrangler.toml
          cat wrangler.toml

      - name: Met en ligne le relais
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4"
          workingDirectory: relais
          secrets: RIOT_API_KEY
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}

      - name: Code d'équipe pour modifier les builds
        working-directory: relais
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BUILD_CODE: ${{ secrets.BUILD_CODE }}
        run: |
          if [ -z "$BUILD_CODE" ]; then
            echo "::warning::Secret BUILD_CODE absent : les builds de l'équipe sont visibles mais personne ne peut les modifier."
            exit 0
          fi
          printf '%s' "$BUILD_CODE" | npx -y wrangler@4 secret put BUILD_CODE

      - name: Donne l'adresse du relais à l'appli
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          test -n "$URL" || { echo "Adresse du relais introuvable"; exit 1; }
          echo "$URL" > relais.txt
          gh release view stats >/dev/null 2>&1 || gh release create stats --prerelease --title "Stats du serveur" --notes "Stats récoltées chaque jour par GitHub."
          gh release upload stats relais.txt --clobber
